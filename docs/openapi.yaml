openapi: 3.0.3
info:
  title: SplitBill API
  version: 1.0.0
  description: REST API for the SplitBill expense-sharing application.
servers:
  - url: http://localhost:5000
    description: Local development
  - url: https://splitbill-7uls.onrender.com
    description: Production

tags:
  - name: Health
  - name: Authentication
  - name: Groups
  - name: Expenses
  - name: Balances
  - name: Settlements
  - name: Notifications

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    groupId:
      name: groupId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    expenseId:
      name: expenseId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    notificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: An error occurred

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          example: Shakthivel
        email:
          type: string
          format: email
          example: shakthivel@example.com
        password:
          type: string
          minLength: 8
          example: password123

    RegisterResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Shakthivel
        email:
          type: string
          example: shakthivel@example.com

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: shakthivel@example.com
        password:
          type: string
          example: password123

    LoginResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Shakthivel
        email:
          type: string
          format: email
          example: shakthivel@example.com
        token:
          type: string
          example: eyJhbGciOiJIUzI1NiIs...

    CreateGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Goa Trip

    Group:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Goa Trip
        createdBy:
          type: integer
          example: 1

    GroupListItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Goa Trip
        created_by:
          type: integer
          example: 1

    AddMemberRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer
          minimum: 1
          example: 2

    Member:
      type: object
      properties:
        user_id:
          type: integer
          example: 2
        username:
          type: string
          example: Arun
        role:
          type: string
          enum: [owner, member]
          example: member

    GroupDetails:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Goa Trip
        createdBy:
          type: integer
          example: 1
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"

    CreateExpenseRequest:
      type: object
      required: [paidBy, amount, description, splitType, splits]
      properties:
        paidBy:
          type: integer
          minimum: 1
          example: 1
        amount:
          type: number
          format: double
          exclusiveMinimum: true
          example: 1000.00
        description:
          type: string
          maxLength: 100
          example: Dinner
        splitType:
          type: string
          enum: [equal]
          example: equal
        splits:
          type: array
          minItems: 1
          items:
            type: object
            required: [userId]
            properties:
              userId:
                type: integer
                minimum: 1
                example: 1
          example:
            - userId: 1
            - userId: 2

    ExpenseListItem:
      type: object
      properties:
        id:
          type: integer
          example: 10
        description:
          type: string
          example: Dinner
        group_id:
          type: integer
          example: 1
        amount:
          type: string
          example: "1000.00"
        paid_by:
          type: integer
          example: 1
        created_by:
          type: integer
          example: 1
        split_type:
          type: string
          example: equal
        created_at:
          type: string
          format: date-time
        my_share:
          type: string
          nullable: true
          example: "500.00"

    ExpenseDetail:
      type: object
      properties:
        expenseId:
          type: integer
          example: 10
        description:
          type: string
          example: Dinner
        groupId:
          type: integer
          example: 1
        amount:
          type: string
          example: "1000.00"
        paidBy:
          type: integer
          example: 1
        createdBy:
          type: integer
          example: 1
        splitType:
          type: string
          example: equal
        createdAt:
          type: string
          format: date-time
        splits:
          type: array
          items:
            type: object
            properties:
              userId:
                type: integer
                example: 1
              amount:
                type: string
                example: "500.00"

    Balance:
      type: object
      properties:
        userId:
          type: integer
          example: 2
        balance:
          type: string
          example: "400.00"

    SettlementRequest:
      type: object
      required: [toUserId, amount]
      properties:
        toUserId:
          type: integer
          minimum: 1
          example: 3
        amount:
          type: number
          format: double
          exclusiveMinimum: true
          example: 100.00

    Settlement:
      type: object
      properties:
        id:
          type: integer
          example: 1
        groupId:
          type: integer
          example: 3
        fromUserId:
          type: integer
          example: 4
        toUserId:
          type: integer
          example: 3
        amount:
          type: number
          example: 100

    SettlementHistoryItem:
      type: object
      properties:
        id:
          type: integer
          example: 1
        from_user_id:
          type: integer
          example: 4
        to_user_id:
          type: integer
          example: 3
        amount:
          type: string
          example: "100.00"
        created_at:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: integer
          example: 5
        group_id:
          type: integer
          example: 3
        created_by:
          type: integer
          example: 2
        type:
          type: string
          example: settlement_created
        message:
          type: string
          example: User has settled and paid you ₹100.00
        created_at:
          type: string
          format: date-time
        read_at:
          type: string
          format: date-time
          nullable: true

paths:
  /health:
    get:
      tags: [Health]
      summary: Check API health
      responses:
        "200":
          description: API is running
          content:
            application/json:
              example:
                status: ok
                message: SplitBill API is running

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user and return a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/groups:
    post:
      tags: [Groups]
      summary: Create a group
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Groups]
      summary: Get groups for the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Groups returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupListItem"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/groups/{groupId}:
    get:
      tags: [Groups]
      summary: Get group details
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/groupId"
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetails"
        "400":
          description: Invalid groupId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User is not permitted to view group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/groups/{groupId}/members:
    post:
      tags: [Groups]
      summary: Add a member to a group
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/groupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
      responses:
        "201":
          description: Member added
          content:
            application/json:
              example:
                groupId: 1
                userId: 2
                createdBy: 1
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User is not permitted to add a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: User already exists in group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/groups/{groupId}/members/{userId}:
    delete:
      tags: [Groups]
      summary: Remove a member from a group
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/groupId"
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              example:
                message: Group member removed successfully
        "400":
          description: Invalid parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User is not permitted to remove a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User is not a member of the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Member has existing expense history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/groups/{groupId}/expenses:
    post:
      tags: [Expenses]
      summary: Create an expense
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/groupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRequest"
      responses:
        "201":
          description: Expense created
          content:
            application/json:
              example:
                message: Expense created successfully
                expense:
                  id: 10
                  group_id: 1
                  paid_by: 1
                  amount: 1000
                  description: Dinner
                  split_type: equal
                  created_by: 1
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User is not authorized or a required group member is missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Expenses]
      summary: Get expenses for a group
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/groupId"
      responses:
        "200":
          description: Expenses returned
          content:
            application/json:
              example:
                message: Expenses fetched successfully
                expenses:
                  - id: 10
                    description: Dinner
                    group_id: 1
                    amount: "1000.00"
                    paid_by: 1
                    created_by: 1
                    split_type: equal
                    created_at: "2026-09-20T10:00:00.000Z"
                    my_share: "500.00"
        "403":
          description: User is not a member of the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/groups/{groupId}/expenses/{expenseId}:
    get:
      tags: [Expenses]
      summary: Get expense details
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/groupId"
        - $ref: "#/components/parameters/expenseId"
      responses:
        "200":
          description: Expense details
          content:
            application/json:
              example:
                message: Expense fetched successfully
                expense:
                  expenseId: 10
                  description: Dinner
                  groupId: 1
                  amount: "1000.00"
                  paidBy: 1
                  createdBy: 1
                  splitType: equal
                  createdAt: "2026-09-20T10:00:00.000Z"
                  splits:
                    - userId: 1
                      amount: "500.00"
                    - userId: 2
                      amount: "500.00"
        "400":
          description: Invalid parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User is not a member of the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags: [Expenses]
      summary: Update an expense
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/groupId"
        - $ref: "#/components/parameters/expenseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRequest"
      responses:
        "200":
          description: Expense updated
          content:
            application/json:
              example:
                message: Expense updated successfully
                expense:
                  id: 10
                  group_id: 1
                  paid_by: 1
                  amount: 1200
                  description: Dinner updated
                  split_type: equal
                  updated_by: 1
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User is not authorized to update the expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags: [Expenses]
      summary: Delete an expense
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/groupId"
        - $ref: "#/components/parameters/expenseId"
      responses:
        "200":
          description: Expense deleted
          content:
            application/json:
              example:
                message: Expense deleted successfully
                expense:
                  expenseId: 10
        "400":
          description: Invalid parameter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User is not authorized to delete the expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/groups/{groupId}/balances:
    get:
      tags: [Balances]
      summary: Get current group balances
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/groupId"
      responses:
        "200":
          description: Group balances returned
          content:
            application/json:
              example:
                message: Group balances fetched successfully
                data:
                  - userId: 2
                    balance: "400.00"
                  - userId: 3
                    balance: "-400.00"
        "400":
          description: Invalid groupId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User is not permitted to view group balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/groups/{groupId}/settlements:
    post:
      tags: [Settlements]
      summary: Create a settlement
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/groupId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettlementRequest"
      responses:
        "201":
          description: Settlement created
          content:
            application/json:
              example:
                message: Settlement created successfully
                data:
                  id: 1
                  groupId: 3
                  fromUserId: 4
                  toUserId: 3
                  amount: 100
        "400":
          description: Invalid request, no debt, or amount exceeds the debt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User is not a member of the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags: [Settlements]
      summary: Get settlement history for a group
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/groupId"
      responses:
        "200":
          description: Settlement history returned
          content:
            application/json:
              example:
                message: Settlements fetched successfully
                data:
                  - id: 1
                    from_user_id: 4
                    to_user_id: 3
                    amount: "100.00"
                    created_at: "2026-09-20T10:00:00.000Z"
        "400":
          description: Invalid groupId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: User is not a member of the group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: Get notifications for the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Notifications returned
          content:
            application/json:
              example:
                message: Notifications fetched successfully
                data:
                  - id: 5
                    group_id: 3
                    created_by: 2
                    type: settlement_created
                    message: User has settled and paid you ₹100.00
                    created_at: "2026-09-20T10:00:00.000Z"
                    read_at: null
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Get unread notification count
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Unread count returned
          content:
            application/json:
              example:
                message: Unread count fetched successfully
                data: 3
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      summary: Mark a notification as read
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/notificationId"
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              example:
                message: Notification marked as read successfully
                data: true
        "400":
          description: Invalid notificationId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
